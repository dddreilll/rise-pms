[PHP]
; Memory limit
memory_limit = 512M

; Upload limits
upload_max_filesize = 50M
post_max_size = 50M
max_execution_time = 300
max_input_time = 300

; Error reporting
display_errors = Off
log_errors = On
error_log = /var/log/php_errors.log

; Session settings
session.gc_maxlifetime = 1440
session.cookie_lifetime = 0

; Date settings
date.timezone = UTC

; File uploads
file_uploads = On
max_file_uploads = 20

; Security
expose_php = Off
allow_url_fopen = On
allow_url_include = Off

; Performance
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 4000
opcache.revalidate_freq = 2
opcache.fast_shutdown = 1

; Extensions
extension=gd
extension=mysqli
extension=pdo_mysql
extension=zip
extension=intl
extension=soap
extension=xsl
extension=curl
extension=xml
extension=imagick 