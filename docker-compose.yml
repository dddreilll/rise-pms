services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rise-pms-app
    ports:
      - '70:80'
    environment:
      PORT: '80'
      CI_ENVIRONMENT: development
      APP_BASE_URL: http://localhost:70/
      APP_INSTALLED: 'true'
      DB_PREFIX: rise_
      MYSQLHOST: db
      MYSQLPORT: '3306'
      MYSQLUSER: rise_user
      MYSQLPASSWORD: rise_password
      MYSQLDATABASE: rise_pms
    volumes:
      - .:/var/www/html
      - ./docker/php.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template
      - ./docker/entrypoint.sh:/usr/local/bin/entrypoint.sh
    depends_on:
      - db
    networks:
      - rise-network

  db:
    image: mysql:8.0
    container_name: rise-pms-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: rise_pms
      MYSQL_USER: rise_user
      MYSQL_PASSWORD: rise_password
      MYSQL_ROOT_USER: root
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_ROOT_HOST: '%'
    ports:
      - '4406:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/db/init_user.sql:/docker-entrypoint-initdb.d/init_user.sql
    networks:
      - rise-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: rise-pms-mailpit
    ports:
      - '2025:1025'
      - '9025:8025'
    networks:
      - rise-network

volumes:
  mysql_data:

networks:
  rise-network:
    driver: bridge
