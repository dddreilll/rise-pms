services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rise-pms-app
    volumes:
      - .:/var/www/html
      - ./docker/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      - db
    networks:
      - rise-network

  nginx:
    image: nginx:latest
    container_name: rise-pms-nginx
    ports:
      - '8080:80'
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - rise-network

  db:
    image: mysql:8.0
    container_name: rise-pms-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: rise_pms
      MYSQL_USER: rise_user
      MYSQL_PASSWORD: rise_password
      MYSQL_ROOT_USER: root
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_ROOT_HOST: '%'
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/db/init_user.sql:/docker-entrypoint-initdb.d/init_user.sql
    networks:
      - rise-network

volumes:
  mysql_data:

networks:
  rise-network:
    driver: bridge
